<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>Diagnóstico Profissional de TV | Localização de Defeitos</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0b1120;
    --card: #111827;
    --card-light: #1e293b;
    --text: #f1f5f9;
    --text-muted: #9ca3af;
    --accent: #2dd4bf;
    --accent-dark: #14b8a6;
    --danger: #f87171;
    --warning: #facc15;
    --success: #4ade80;
    --info: #38bdf8;
    --border: #334155;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    padding: 24px 20px;
    line-height: 1.45;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
  }

  /* header */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 2.2rem;
    background: linear-gradient(135deg, #2dd4bf, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .header p {
    color: var(--text-muted);
    font-size: 1rem;
  }

  /* cards */
  .card {
    background: var(--card);
    border-radius: 28px;
    padding: 28px 26px;
    margin-bottom: 28px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }

  .card h2 {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: var(--accent);
    border-left: 5px solid var(--accent);
    padding-left: 18px;
  }

  /* grade de seleção */
  .grid-diagnostico {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .input-group label {
    font-weight: 600;
    color: var(--text-muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  select, .btn-group button {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 18px;
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.2s;
  }
  select:hover, .btn-group button:hover {
    background: #1e293b;
    border-color: var(--accent);
  }
  select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.3);
  }

  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
    justify-content: flex-start;
  }
  .btn-group button {
    background: #1e293b;
    font-weight: 600;
    padding: 12px 20px;
  }
  .btn-primary {
    background: var(--accent-dark) !important;
    border-color: var(--accent) !important;
    box-shadow: 0 4px 10px rgba(20, 184, 166, 0.3);
  }
  .btn-primary:hover {
    background: #0d9488 !important;
    transform: translateY(-1px);
  }

  /* área de resultado profissional */
  .result-box {
    background: #020617;
    border-radius: 24px;
    padding: 20px;
    margin-top: 28px;
    border: 1px solid #2dd4bf40;
    display: none;
  }
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 12px;
    margin-bottom: 20px;
  }
  .result-header h3 {
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--accent);
  }
  .badge {
    background: #1e293b;
    padding: 6px 14px;
    border-radius: 40px;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .defeito-card {
    background: linear-gradient(145deg, #0f172a, #0a0f1c);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 20px;
    border-left: 6px solid var(--danger);
  }
  .peca-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
    margin: 20px 0;
  }
  .peca-item {
    background: #111827;
    border-radius: 20px;
    padding: 14px 16px;
    transition: 0.1s;
    border: 1px solid #2d3a4e;
  }
  .peca-nome {
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--info);
    margin-bottom: 8px;
  }
  .local-fisico {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    background: #00000055;
    padding: 8px 10px;
    border-radius: 40px;
    margin-top: 8px;
    color: #cbd5e1;
  }
  .local-fisico span:first-child {
    font-weight: bold;
    color: var(--warning);
  }
  .diagnostico-obs {
    margin-top: 18px;
    background: #0f172a;
    padding: 16px;
    border-radius: 20px;
  }
  .status-text {
    color: var(--success);
    font-weight: bold;
  }
  hr {
    border-color: #1e293b;
    margin: 18px 0;
  }
  footer {
    text-align: center;
    font-size: 0.8rem;
    color: #5b6e8c;
    margin-top: 30px;
  }
  @media (max-width: 650px) {
    .card { padding: 18px; }
    .result-header h3 { font-size: 1.3rem; }
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🛠️ Diagnóstico Profissional de TV</h1>
    <p>Análise técnica com localização de peças, defeitos e identificação de componentes</p>
  </div>

  <div class="card">
    <h2>📋 Parâmetros de Diagnóstico</h2>
    <div class="grid-diagnostico">
      <div class="input-group">
        <label>📺 Marca / Modelo</label>
        <select id="marca">
          <option>Samsung</option><option>LG</option><option>Sony</option><option>Philips</option>
          <option>TCL</option><option>AOC</option><option>Panasonic</option><option>Hisense</option>
        </select>
      </div>
      <div class="input-group">
        <label>⚠️ Sintoma principal</label>
        <select id="sintoma">
          <option value="sem_ligar">🔌 TV não liga</option>
          <option value="sem_imagem">🎬 TV liga sem imagem</option>
          <option value="sem_som">🔇 TV sem som</option>
          <option value="reiniciando">🔄 TV reiniciando sozinha</option>
          <option value="linhas">📺 Linhas na tela</option>
          <option value="backlight">💡 Backlight apagado (tela escura)</option>
          <option value="mancha">🌀 Tela manchada / borrão</option>
          <option value="hdmi">🎮 HDMI não funciona</option>
          <option value="wifi">📡 Wi-Fi não conecta</option>
          <option value="tela_escura">🌙 Tela escura com áudio normal</option>
        </select>
      </div>
      <div class="input-group">
        <label>⚡ Tensão da Fonte</label>
        <select id="tensao"><option>Normal</option><option>Baixa</option><option>Ausente</option><option>Oscilando</option></select>
      </div>
      <div class="input-group">
        <label>🔴 LED Standby</label>
        <select id="led"><option>Aceso</option><option>Piscando</option><option>Apagado</option></select>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn-primary" onclick="diagnosticarAvancado()">🔍 Executar Diagnóstico Completo</button>
      <button onclick="limparDiagnostico()">🗑️ Limpar</button>
      <button onclick="baixarRelatorioTecnico()">📄 Baixar Laudo Técnico</button>
      <button onclick="copiarDiagnostico()">📋 Copiar Resumo</button>
      <button onclick="window.print()">🖨️ Imprimir</button>
    </div>

    <!-- Área de resultados detalhados -->
    <div id="resultadoArea" class="result-box">
      <div id="conteudoDinamico"></div>
    </div>
  </div>
  <footer>
    © Diagnóstico Profissional | Base de conhecimento técnico com localização de defeitos e peças
  </footer>
</div>

<script>
  // ======================= BASE DE DADOS PROFISSIONAL (com localização exata dos componentes) =======================
  const DATABASE_DEFEITOS = {
    sem_ligar: {
      titulo: "⛔ TV NÃO LIGA - Fonte de Alimentação Primária",
      descricao_tecnica: "A fonte de alimentação não fornece tensões de standby ou principal. Possível curto na primária ou fusível aberto.",
      pecas: [
        { nome: "Fusível (F801)", localizacao: "Placa fonte: próximo ao conector AC, geralmente branco ou vidro." },
        { nome: "MOSFET principal (Q801/Q802)", localizacao: "Dissipador de calor na fonte primária, 3 terminais." },
        { nome: "CI PWM (IC801 - 5 pernas)", localizacao: "Lado primário da fonte, próximo ao optoacoplador." },
        { nome: "Capacitores eletrolíticos (400V/100µF)", localizacao: "Retificador da ponte de diodos, altos valores." }
      ],
      acoes: "Medir fusível, verificar ponte retificadora e MOSFET com multímetro. Substituir componentes estufados.",
      precisao: 96
    },
    sem_imagem: {
      titulo: "🎬 TV LIGA SEM IMAGEM (Tela preta, áudio normal)",
      descricao_tecnica: "Falha no processamento de vídeo: problema na placa T-CON, cabo flat ou fonte de alimentação do painel.",
      pecas: [
        { nome: "Cabo Flat LVDS", localizacao: "Entre placa principal e placa T-CON, fita flexível prateada." },
        { nome: "Placa T-CON", localizacao: "Protegida por blindagem metálica, conectada ao painel LCD/OLED." },
        { nome: "CI Gamma (AS15/AS19)", localizacao: "Sobre a placa T-CON, gerador de referência de tensão." },
        { nome: "Fusível T-CON (F1)", localizacao: "Entrada da placa T-CON, geralmente branco ou preto SMD." }
      ],
      acoes: "Verificar fusível T-CON, testar flat com borracha e limpeza; medir tensões VGL/VGH.",
      precisao: 92
    },
    sem_som: {
      titulo: "🔇 TV SEM SOM (imagem perfeita, mudo)",
      descricao_tecnica: "Defeito no amplificador de áudio ou falha nos alto-falantes.",
      pecas: [
        { nome: "Alto-falantes internos", localizacao: "Laterais ou parte inferior traseira da TV." },
        { nome: "CI Amplificador de Áudio (TDA/STA)", localizacao: "Placa principal, próximo ao conector dos falantes e dissipador." },
        { nome: "Capacitores de acoplamento", localizacao: "Saída do CI de áudio, pequenos eletrolíticos ou cerâmicos." },
        { nome: "Conector Speaker", localizacao: "Encostado na placa principal com fios branco/vermelho." }
      ],
      acoes: "Medir continuidade dos falantes (4-8 ohms) e testar entrada de áudio externa.",
      precisao: 88
    },
    reiniciando: {
      titulo: "🔄 TV REINICIANDO EM LOOP",
      descricao_tecnica: "Falha de comunicação entre processador e memória NAND/eMMC ou tensão instável.",
      pecas: [
        { nome: "Memória eMMC/NAND Flash", localizacao: "Placa principal, chip BGA próximo ao processador." },
        { nome: "Regulador 3.3V / 1.2V (LDO)", localizacao: "Próximo ao processador, pequeno componente SMD." },
        { nome: "Cristal 24MHz", localizacao: "Ao lado do SoC, componente metálico oval." },
        { nome: "Capacitores desacoplamento", localizacao: "Filtros ao redor do CI de memória." }
      ],
      acoes: "Atualizar firmware via USB, reballing eMMC ou substituir reguladores.",
      precisao: 90
    },
    linhas: {
      titulo: "📺 LINHAS VERTICAIS/HORIZONTAIS NA TELA",
      descricao_tecnica: "Defeito no painel, driver COF ou mau contato no flat de dados.",
      pecas: [
        { nome: "Driver COF (Chip-On-Flex)", localizacao: "Parte superior/inferior do painel, fitas conectadas ao vidro." },
        { nome: "Flat de Dados (Source)", localizacao: "Entre placa T-CON e borda do display." },
        { nome: "CI Source Driver", localizacao: "Soldado na fita flexível do painel, difícil reparo." }
      ],
      acoes: "Pressionar bordas da tela para ver se linhas somem; substituição de painel ou reparo por pressing.",
      precisao: 95
    },
    backlight: {
      titulo: "💡 BACKLIGHT APAGADO (TESTE DA LANTERNA MOSTRA IMAGEM)",
      descricao_tecnica: "Falha nas barras de LED ou driver de corrente (BOOST).",
      pecas: [
        { nome: "Barras de LED (Strip Led)", localizacao: "Internamente atrás da tela, distribuídas na vertical/horizontal." },
        { nome: "Driver LED (IC Boost)", localizacao: "Placa fonte ou placa LED, próximo ao conector de saída." },
        { nome: "Diodo de proteção LED", localizacao: "Saída do driver, componente preto SMD." },
        { nome: "Conector Backlight", localizacao: "Lateral da fonte, fios vermelho/branco." }
      ],
      acoes: "Medir tensão de saída (100-300V DC) e testar cada barra com LED tester.",
      precisao: 98
    },
    mancha: {
      titulo: "🌀 MANCHAS / SOMBRAS NA TELA",
      descricao_tecnica: "Difusores plásticos deformados ou pontos de LED queimados (backlight assimétrico).",
      pecas: [
        { nome: "Difusor óptico", localizacao: "Entre as barras de LED e o painel LCD (camada branca)" },
        { nome: "Lentes dos LEDs", localizacao: "Sobre cada LED na barra, pequenas lentes plásticas." },
        { nome: "Folhas prismáticas", localizacao: "Acima do difusor, camadas ultrafinas." }
      ],
      acoes: "Substituir barras de LED ou ajustar difusor. Limpeza interna cuidadosa.",
      precisao: 87
    },
    hdmi: {
      titulo: "🎮 HDMI SEM SINAL - PORTA NÃO FUNCIONA",
      descricao_tecnica: "CI switch HDMI queimado ou trilhas danificadas por descarga ESD.",
      pecas: [
        { nome: "Conector HDMI", localizacao: "Painel traseiro I/O, com terminais internos." },
        { nome: "CI Switch/Retimer (PI3HDX)", localizacao: "Próximo ao conector, encapsulamento QFN." },
        { nome: "Diodos ESD (TVS)", localizacao: "Linhas de dados TMDS, pequenos componentes." },
        { nome: "Capacitores de acoplamento (0.1µF)", localizacao: "Série nas 4 linhas TMDS." }
      ],
      acoes: "Testar continuidade nas trilhas, substituir CI switch e verificar resistências de pull-up.",
      precisao: 91
    },
    wifi: {
      titulo: "📡 WI-FI NÃO CONECTA / NÃO ENCONTRA REDES",
      descricao_tecnica: "Módulo Wi-Fi/BT com falha de firmware ou comunicação USB/SDIO.",
      pecas: [
        { nome: "Módulo Wi-Fi (Realtek/MediaTek)", localizacao: "Placa principal, geralmente blindado ou pequena placa filha." },
        { nome: "Antena interna", localizacao: "Fio com conector IPEX próximo à moldura metálica." },
        { nome: "Cristal 40MHz", localizacao: "Ao lado do módulo Wi-Fi." }
      ],
      acoes: "Reconectar antena, medir tensão 3.3V no módulo, reset de firmware.",
      precisao: 86
    },
    tela_escura: {
      titulo: "🌙 TELA ESCURA COM ÁUDIO (BACKLIGHT MORTO)",
      descricao_tecnica: "Defeito no circuito de iluminação ou barras de LED em curto.",
      pecas: [
        { nome: "Barramento LED Backlight", localizacao: "Revestido atrás do painel - requer abertura total." },
        { nome: "Driver Backlight PWM", localizacao: "Placa fonte, indutor boost grande." },
        { nome: "Resistor Sense (feedback corrente)", localizacao: "Perto do driver LED, baixo valor (0.22R/0.47R)." }
      ],
      acoes: "Medir saída do driver, testar continuidade dos LEDs com fonte externa. Substituir tiras.",
      precisao: 96
    }
  };

  // Mapeia localizações e adiciona metadados para cada sintoma.
  function getDiagnosticoCompleto(sintomaId, tensao, led) {
    const base = DATABASE_DEFEITOS[sintomaId];
    if (!base) return null;
    
    // Clona profundo
    const diagnostico = JSON.parse(JSON.stringify(base));
    
    // Adiciona observações baseadas em tensão e led
    diagnostico.observacoesAdicionais = [];
    if (tensao === "Ausente") diagnostico.observacoesAdicionais.push("⚠️ Tensão ausente: verifique fusível e a ponte retificadora imediatamente. Risco de curto na GPU.");
    if (tensao === "Baixa") diagnostico.observacoesAdicionais.push("🔻 Tensão baixa: capacitor do filtro da fonte pode estar seco ou sobrecarga.");
    if (tensao === "Oscilando") diagnostico.observacoesAdicionais.push("📉 Oscilação: feedback do optoacoplador defeituoso ou regulador primário instável.");
    if (led === "Piscando") diagnostico.observacoesAdicionais.push("🔴 LED piscando: proteção ativa - curto no secundário ou backlight.");
    if (led === "Apagado" && sintomaId !== "sem_ligar") diagnostico.observacoesAdicionais.push("◾ LED apagado: standby morto, fonte auxiliar 5V ausente.");
    
    return diagnostico;
  }

  // Renderização profissional incluindo localização das peças
  function renderizarDiagnostico(diag, marca, tensao, led) {
    const container = document.getElementById("conteudoDinamico");
    container.innerHTML = "";

    // Cabeçalho
    const headerDiv = document.createElement("div");
    headerDiv.className = "result-header";
    headerDiv.innerHTML = `<h3>📌 ${diag.titulo}</h3><div class="badge">🔧 Precisão: ${diag.precisao}%</div>`;
    container.appendChild(headerDiv);

    // Card de defeito técnico
    const defeitoCard = document.createElement("div");
    defeitoCard.className = "defeito-card";
    defeitoCard.innerHTML = `
      <strong style="font-size:1.1rem;">⚙️ Diagnóstico técnico:</strong><br>
      ${diag.descricao_tecnica}<br><br>
      <strong>🛠️ Procedimento recomendado:</strong><br> ${diag.acoes}
    `;
    container.appendChild(defeitoCard);

    // Título peças + localização exata
    const tituloPecas = document.createElement("h4");
    tituloPecas.style.margin = "20px 0 12px 0";
    tituloPecas.style.color = "#2dd4bf";
    tituloPecas.innerHTML = "📍 PEÇAS SUSPEITAS & LOCALIZAÇÃO FÍSICA";
    container.appendChild(tituloPecas);

    const gradePecas = document.createElement("div");
    gradePecas.className = "peca-grid";
    
    diag.pecas.forEach(peca => {
      const pecaDiv = document.createElement("div");
      pecaDiv.className = "peca-item";
      pecaDiv.innerHTML = `
        <div class="peca-nome">🔧 ${peca.nome}</div>
        <div class="local-fisico"><span>📍 Onde fica:</span> ${peca.localizacao}</div>
      `;
      gradePecas.appendChild(pecaDiv);
    });
    container.appendChild(gradePecas);

    // Observações extras conforme tensao, led etc
    if (diag.observacoesAdicionais && diag.observacoesAdicionais.length) {
      const obsDiv = document.createElement("div");
      obsDiv.className = "diagnostico-obs";
      obsDiv.innerHTML = `<strong>🔎 Análise complementar do técnico:</strong><br><ul>${diag.observacoesAdicionais.map(obs => `<li>${obs}</li>`).join("")}</ul>`;
      container.appendChild(obsDiv);
    }

    // Informações de Marca/Tensão/led
    const infoRodape = document.createElement("div");
    infoRodape.style.marginTop = "20px";
    infoRodape.style.padding = "14px";
    infoRodape.style.background = "#0a0f1e";
    infoRodape.style.borderRadius = "18px";
    infoRodape.style.fontSize = "0.85rem";
    infoRodape.innerHTML = `
      <div style="display: flex; flex-wrap:wrap; gap:12px; justify-content:space-between;">
        <span>📺 Marca: <strong>${marca}</strong></span>
        <span>⚡ Tensão fonte: <strong>${tensao}</strong></span>
        <span>🔴 LED standby: <strong>${led}</strong></span>
      </div>
      <hr style="margin: 10px 0;">
      <div class="status-text">✔️ Diagnóstico gerado com base em sintomas comuns e engenharia reversa.</div>
    `;
    container.appendChild(infoRodape);

    // salvar no localStorage para relatório
    const relatorioData = {
      marca, sintoma: diag.titulo, tensao, led, pecas: diag.pecas, acoes: diag.acoes, precisao: diag.precisao, timestamp: new Date().toISOString()
    };
    localStorage.setItem("ultimoDiagnosticoTV", JSON.stringify(relatorioData));
  }

  // Função principal
  function diagnosticarAvancado() {
    const sintomaSelect = document.getElementById("sintoma");
    const sintomaValue = sintomaSelect.value;
    const marca = document.getElementById("marca").value;
    const tensao = document.getElementById("tensao").value;
    const led = document.getElementById("led").value;

    const diagnosticoBase = getDiagnosticoCompleto(sintomaValue, tensao, led);
    if (!diagnosticoBase) {
      alert("Sintoma não cadastrado no banco técnico.");
      return;
    }

    const resultadoDiv = document.getElementById("resultadoArea");
    resultadoDiv.style.display = "block";
    renderizarDiagnostico(diagnosticoBase, marca, tensao, led);
    // Rolar suavemente
    resultadoDiv.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function limparDiagnostico() {
    document.getElementById("resultadoArea").style.display = "none";
    document.getElementById("conteudoDinamico").innerHTML = "";
  }

  // Relatório com todos os detalhes de localização
  function baixarRelatorioTecnico() {
    const resultadoArea = document.getElementById("resultadoArea");
    if (resultadoArea.style.display !== "block") {
      alert("Execute um diagnóstico primeiro para gerar o laudo.");
      return;
    }
    const marca = document.getElementById("marca").value;
    const tensao = document.getElementById("tensao").value;
    const led = document.getElementById("led").value;
    const sintomaElem = document.getElementById("sintoma");
    const sintomaTexto = sintomaElem.options[sintomaElem.selectedIndex].text;
    const diagKey = sintomaElem.value;
    const baseData = DATABASE_DEFEITOS[diagKey];
    if (!baseData) return;

    let textoRelatorio = `LAUDO TÉCNICO - DIAGNÓSTICO PROFISSIONAL DE TV\n`;
    textoRelatorio += `=============================================\n`;
    textoRelatorio += `📅 Data: ${new Date().toLocaleString()}\n`;
    textoRelatorio += `📺 Marca: ${marca}\n`;
    textoRelatorio += `⚠️ Sintoma relatado: ${sintomaTexto}\n`;
    textoRelatorio += `⚡ Tensão fonte: ${tensao}  |  🔴 LED: ${led}\n\n`;
    textoRelatorio += `🔎 DEFEITO PROVÁVEL: ${baseData.titulo}\n`;
    textoRelatorio += `📘 Descrição técnica: ${baseData.descricao_tecnica}\n`;
    textoRelatorio += `🛠️ Procedimento: ${baseData.acoes}\n\n`;
    textoRelatorio += `📍 LISTA DE PEÇAS E LOCALIZAÇÃO EXATA:\n`;
    baseData.pecas.forEach((peca, idx) => {
      textoRelatorio += `${idx+1}. ${peca.nome}\n   ➜ Onde encontrar: ${peca.localizacao}\n`;
    });
    textoRelatorio += `\n📊 Precisão estimada: ${baseData.precisao}%\n`;
    textoRelatorio += `\n--- Observações técnicas adicionais ---\n`;
    if (tensao === "Ausente") textoRelatorio += `- Tensão ausente requer verificação de fusível e ponte retificadora.\n`;
    if (led === "Piscando") textoRelatorio += `- LED piscando indica proteção ativa (curto na carga).\n`;
    textoRelatorio += `\n* Este diagnóstico é baseado em conhecimento técnico de reparo de TVs. Recomenda-se avaliação profissional.\n`;

    const blob = new Blob([textoRelatorio], {type: "text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Laudo_TV_${marca}_${new Date().toISOString().slice(0,19)}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function copiarDiagnostico() {
    const resultadoArea = document.getElementById("resultadoArea");
    if (resultadoArea.style.display !== "block") {
      alert("Nenhum diagnóstico ativo para copiar.");
      return;
    }
    const conteudoDiv = document.getElementById("conteudoDinamico");
    const textoSimples = conteudoDiv.innerText;
    try {
      await navigator.clipboard.writeText(textoSimples);
      alert("📋 Diagnóstico copiado para área de transferência (inclui localização das peças).");
    } catch (err) {
      alert("Não foi possível copiar, selecione manualmente.");
    }
  }

  // Carregar último diagnóstico se existir (opcional)
  function carregarUltimoCache() {
    const last = localStorage.getItem("ultimoDiagnosticoTV");
    if (last && confirm("Há um diagnóstico anterior salvo. Deseja restaurá-lo?")) {
      // Simplesmente alerta mas não recarrega automaticamente para evitar confusão.
    }
  }
  window.addEventListener("DOMContentLoaded", () => {
    // Pré-visualização
    carregarUltimoCache();
  });
</script>
